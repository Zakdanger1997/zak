  if (s > 1) { const k = pop((s - 1) / 0.5); ctx.save(); ctx.translate(600, 870); ctx.scale(k, k); counter(0, 0, 300, 100, '300 N·m'); ctx.restore(); }
  dial(930, 930, 110, 0.86 + 0.14 * eo((s - 0.5) / 1.5));
  stickman(980, 1330, 330, { armL: -1.9, armR: -0.4 });
  if (s > d - 3.2) { const k = ease((s - (d - 3.2)) / 0.6); ctx.fillStyle = `rgba(239,230,210,${k})`; ctx.fillRect(0, 0, W, H); if (k > 0.5) { text('الجيربوكس بيشتغل إزاي؟', W / 2, 880, 90, P.ink); text('موتور قد الإيد… سير بطول الأوضة', W / 2, 1010, 50, P.red, 700); gear(540, 1250, 120, 20, s * 1.5, P.grey, true); } }
 },
];

// ---------- master clock ----------
function sceneAt(t) {
  if (!TL) return { i: 0, s: t, d: 10, words: null, t0: 0 };
  let acc = 0;
  for (let i = 0; i < TL.scenes.length; i++) { const sc = TL.scenes[i]; if (t < acc + sc.dur || i === TL.scenes.length - 1) { return { i, s: t - acc, d: sc.dur, words: sc.words, t0: acc, lead: sc.lead }; } acc += sc.dur; }
}
window.__seek = function (t) {
  const sc = sceneAt(t);
  paper();
  scenes[sc.i](Math.max(0, sc.s), sc.d);
  brand();
  if (sc.words) subtitle(sc.words, sc.s - sc.lead);
  return sc.i;
};
window.__ready = document.fonts.load('900 80px Cairo').then(() => document.fonts.load('700 50px Cairo')).then(() => true);
// audio-driven playback
const au = document.getElementById('au'), btn = document.getElementById('play'), fill = document.getElementById('fill');
let playing = false;
function tick() { const t = Math.min(au.currentTime, TL.total - 0.01); window.__seek(t); fill.style.width = (t / TL.total * 100) + '%'; if (playing) requestAnimationFrame(tick); }
btn.addEventListener('click', () => { au.currentTime = 0; au.play().then(() => { playing = true; btn.hidden = true; tick(); }).catch(() => {}); });
au.addEventListener('ended', () => { playing = false; btn.hidden = false; btn.querySelector('span').textContent = '↻'; });
document.getElementById('wrap').addEventListener('click', (e) => { if (e.target === btn || btn.contains(e.target)) return; if (playing) { au.pause(); playing = false; btn.hidden = false; btn.querySelector('span').textContent = '▶'; } else if (au.currentTime > 0 && au.currentTime < au.duration) { au.play(); playing = true; btn.hidden = true; tick(); } });
window.__ready.then(() => window.__seek(0.3)).catch(() => window.__seek(0.3));
</script>
