<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Drive Handbook – i.Mak</title>
<meta name="description" content="Gearboxes, motors and pumps explained by moving them: an interactive 3D handbook by i.Mak Gearboxes and Drives.">
<style>
  @font-face { font-family: Barlow; font-weight: 400; src: url(fonts/barlow-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Barlow; font-weight: 500; src: url(fonts/barlow-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: Barlow; font-weight: 600; src: url(fonts/barlow-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: Barlow; font-weight: 400; src: url(fonts/barlow-latin-ext-400-normal.woff2) format('woff2'); unicode-range: U+0100-024F, U+1E00-1EFF, U+2070-209F; }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 500; src: url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 600; src: url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url(fonts/barlow-condensed-latin-ext-700-normal.woff2) format('woff2'); unicode-range: U+0100-024F, U+1E00-1EFF, U+2070-209F; }
  html, body { margin: 0; height: 100%; background: #1a1f25; overflow: hidden; font-family: Barlow, sans-serif; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; color: #e9edf1; }
  #ui .brand { position: absolute; left: 18px; top: 14px; display: flex; align-items: center; gap: 10px; font: 600 15px 'Barlow Condensed'; letter-spacing: .12em; text-transform: uppercase; }
  #ui .brand b { color: #ff3b30; }
  #ui .tabs { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; justify-content: center; max-width: 70vw; }
  #ui .tabs button { font: 500 14px 'Barlow Condensed'; letter-spacing: .04em; color: #cfd6dd; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  #ui .tabs button.on { background: #cc0605; border-color: #cc0605; color: #fff; }
  #ui .hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font: 500 14px Barlow; color: #9aa6b1; background: rgba(0,0,0,.25); padding: 6px 14px; border-radius: 999px; white-space: nowrap; }
  #side { display: none; position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%); pointer-events: auto; font: 600 17px Barlow; color: #fff; background: #cc0605; border: 0; padding: 12px 22px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.35); cursor: pointer; white-space: nowrap; }
  @media (max-width: 700px) {
    #ui .tabs { flex-wrap: nowrap; overflow-x: auto; max-width: 96vw; justify-content: flex-start; padding: 0 4px; scrollbar-width: none; }
    #ui .tabs button { font-size: 13px; padding: 7px 10px; white-space: nowrap; flex: none; }
    #ui .brand { display: none; } #ui .hint { font-size: 11px; bottom: 12px; }
  }
  /* recording overlays */
  .ov { position: fixed; left: 0; right: 0; pointer-events: none; text-align: center; transition: none; }
  #hook { top: 0; padding: 64px 70px 90px; background: linear-gradient(rgba(16,20,25,.92) 0%, rgba(16,20,25,.75) 60%, rgba(16,20,25,0) 100%); font: 700 74px/1.04 'Barlow Condensed'; color: #fff; letter-spacing: -.005em; }
  #hook:empty { display: none; }
  #hook em { font-style: normal; color: #ff2d22; }
  #cap { bottom: 64px; padding: 0 60px; }
  #cap span { display: inline-block; font: 600 44px/1.2 Barlow; color: #fff; background: rgba(14,18,23,.82); padding: 14px 26px; border-radius: 14px; }
  #cursor { position: fixed; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255,255,255,.35); border: 3px solid #fff; box-shadow: 0 4px 14px rgba(0,0,0,.4); pointer-events: none; display: none; }
  #cursor.tap { background: rgba(204,6,5,.55); }
  #endcard { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(16,20,25,.9); color: #fff; text-align: center; }
  #endcard h1 { font: 700 96px/1 'Barlow Condensed'; margin: 0 60px 26px; }
  #endcard p { font: 500 42px/1.3 Barlow; margin: 0 80px 54px; color: #d5dbe1; }
  #endcard img { width: 360px; background: #fff; padding: 22px 30px; border-radius: 14px; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="brand"><b>i.Mak</b> Drive Handbook</div>
  <div class="tabs"></div>
  <button id="side"></button>
  <div class="hint">Drag the red dial · tap an answer · lift the flap · tabs turn pages</div>
</div>
<div id="hook" class="ov"></div>
<div id="cap" class="ov"></div>
<div id="cursor"></div>
<div id="endcard"><h1></h1><p></p><img src="img/logo.png" alt="i.Mak"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
