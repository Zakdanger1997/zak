<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'Inter';font-weight:400;src:url('assets/fonts/inter-400.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-weight:500;src:url('assets/fonts/inter-500.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-weight:600;src:url('assets/fonts/inter-600.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-weight:700;src:url('assets/fonts/inter-700.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-weight:800;src:url('assets/fonts/inter-800.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-weight:900;src:url('assets/fonts/inter-900.woff2') format('woff2');}
  html,body{margin:0;padding:0;background:#20201e;}
  #c{display:block;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script src="data.js"></script>
<script src="assets/world.js"></script>
<script src="assets/logo.js"></script>
<script>
const W=1080, H=1080, FPS=30;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const D=window.DATA;

// ---------- palette ----------
const C={
  bg:'#F4F1EC', bg2:'#ECE7DF', ink:'#17120F', sub:'#6E675E', faint:'#A79E90',
  red:'#920000', redHi:'#B81414', card:'#FFFFFF', cardBd:'#E6E0D5',
  land:'#E2DBCE', landBd:'#D3CABA', shadow:'rgba(40,30,20,0.10)'
};

// ---------- assets ----------
const logo=new Image(); logo.src=window.LOGOURI||'assets/imak_logo@4x.png';
const WORLD=window.WORLDDATA||{land:[],turkey:[]};
const logoReady=new Promise(res=>{logo.onload=res; logo.onerror=res;});
window.__ready=Promise.all([document.fonts.ready, logoReady]);

// ---------- math / easing ----------
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
// appear: 0..1 over [start, start+dur] from local time lt, eased
function app(lt,start,dur,ease=easeOut){return ease(clamp((lt-start)/dur));}
function fmt(n){return Math.round(n).toLocaleString('en-US');}
// count value eased toward target over window
function count(lt,start,dur,target){return Math.round(easeOut(clamp((lt-start)/dur))*target);}

// ---------- text helper ----------
function text(str,x,y,{size=40,weight=700,color=C.ink,align='left',baseline='alphabetic',ls=0,alpha=1,halo=0}={}){
  ctx.save();
  ctx.globalAlpha*=alpha;
  ctx.textAlign=align; ctx.textBaseline=baseline;
  ctx.font=`${weight} ${size}px Inter, sans-serif`;
  try{ctx.letterSpacing=ls+'px';}catch(e){}
  if(halo){ctx.strokeStyle='rgba(244,241,236,0.95)';ctx.lineWidth=halo;ctx.lineJoin='round';ctx.strokeText(str,x,y);}
  ctx.fillStyle=color;
  ctx.fillText(str,x,y);
  ctx.restore();
}
function measure(str,size,weight,ls=0){
  ctx.save();ctx.font=`${weight} ${size}px Inter, sans-serif`;try{ctx.letterSpacing=ls+'px';}catch(e){}
  const w=ctx.measureText(str).width;ctx.restore();return w;
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// kicker label (uppercase, tracked, with a short red rule)
function kicker(str,cx,y,alpha=1){
  const size=26, ls=5;
  const w=measure(str.toUpperCase(),size,700,ls);
  ctx.save();ctx.globalAlpha*=alpha;
  const rule=46, gap=20;
  const total=rule+gap+w+gap+rule;
  const x0=cx-total/2;
  ctx.strokeStyle=C.red;ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x0+rule,y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x0+total-rule,y);ctx.lineTo(x0+total,y);ctx.stroke();
  text(str.toUpperCase(),cx,y,{size,weight:700,color:C.red,align:'center',baseline:'middle',ls});
  ctx.restore();
}

// gear
function gear(cx,cy,rOut,teeth,rot,color,hole=0.46,alpha=1){
  ctx.save();ctx.globalAlpha*=alpha;ctx.translate(cx,cy);ctx.rotate(rot);
  const rIn=rOut*0.80, tw=Math.PI/teeth*0.62;
  ctx.beginPath();
  for(let i=0;i<teeth;i++){
    const a=i/teeth*Math.PI*2;
    ctx.lineTo(Math.cos(a-tw)*rIn,Math.sin(a-tw)*rIn);
    ctx.lineTo(Math.cos(a-tw*0.6)*rOut,Math.sin(a-tw*0.6)*rOut);
    ctx.lineTo(Math.cos(a+tw*0.6)*rOut,Math.sin(a+tw*0.6)*rOut);
    ctx.lineTo(Math.cos(a+tw)*rIn,Math.sin(a+tw)*rIn);
  }
  ctx.closePath();ctx.fillStyle=color;ctx.fill();
  // hub hole
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath();ctx.arc(0,0,rOut*hole,0,Math.PI*2);ctx.fill();
  ctx.globalCompositeOperation='source-over';
  ctx.restore();
}

// ---------- background + persistent chrome ----------
function background(){
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  // soft vignette
  const g=ctx.createRadialGradient(W/2,H*0.42,200,W/2,H*0.5,760);
  g.addColorStop(0,'rgba(255,255,255,0.35)');g.addColorStop(1,'rgba(214,205,190,0.22)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // faint dot grid
  ctx.fillStyle='rgba(120,105,85,0.05)';
  for(let x=60;x<W;x+=48)for(let y=60;y<H;y+=48){ctx.beginPath();ctx.arc(x,y,1.3,0,Math.PI*2);ctx.fill();}
}
function chrome(t,hideLogo){
  // top progress line
  ctx.fillStyle='rgba(120,110,95,0.18)';ctx.fillRect(0,0,W,5);
  ctx.fillStyle=C.red;ctx.fillRect(0,0,W*clamp(t/TOTAL),5);
  if(!hideLogo){
    const lh=38, lw=logo.width*(lh/logo.height);
    ctx.save();ctx.globalAlpha=0.96;ctx.drawImage(logo,86,60,lw,lh);ctx.restore();
  }
  text(D.web, W-86, 1012, {size:22,weight:600,color:C.faint,align:'right',ls:1});
}

// ===================================================================
// SCENES
// ===================================================================
const SC=[]; // {dur, draw(lt,dur)}
function scene(dur,draw){SC.push({dur,draw});}

// transition alpha + rise for a scene's whole content
function enter(lt,dur){
  const a=Math.min(clamp(lt/0.45), clamp((dur-lt)/0.33));
  const rise=(1-clamp(lt/0.5))*22;
  return {a, rise};
}

// ---- S1: HOOK ----
scene(4.4,(lt,dur)=>{
  const {a,rise}=enter(lt,dur);
  ctx.save();ctx.globalAlpha=a;ctx.translate(0,rise);
  const cx=W/2;
  // rotating gears cluster
  const spin=lt*0.6;
  gear(cx+150, 300, 70, 12, spin, C.bg2, .5, app(lt,0.1,0.6));
  gear(cx, 330, 120, 14, -spin*0.7, C.red, .46, app(lt,0,0.6)*easeOutBack(clamp(lt/0.7)));
  gear(cx-150, 360, 60, 10, spin*1.2, '#2B2622', .5, app(lt,0.2,0.6));
  kicker('The story of i.Mak', cx, 560, app(lt,0.25,0.45));
  // big headline — front-loaded so the hook lands inside ~2s
  text('50 years', cx, 690, {size:128,weight:900,color:C.ink,align:'center',ls:-2,alpha:app(lt,0.35,0.5)});
  text('in motion', cx, 800, {size:128,weight:900,color:C.red,align:'center',ls:-2,alpha:app(lt,0.55,0.5)});
  text('From one İstanbul workshop, 1973 — to the world.', cx, 880,
      {size:30,weight:500,color:C.sub,align:'center',ls:0.3,alpha:app(lt,0.85,0.6)});
  ctx.restore();
});

// ---- S2: ORIGIN 1973 ----
scene(4.2,(lt,dur)=>{
  const {a,rise}=enter(lt,dur);
  ctx.save();ctx.globalAlpha=a;ctx.translate(0,rise);
  const cx=W/2;
  kicker('İstanbul · Türkiye', cx, 300, app(lt,0.1,0.5));
  // 1973 draws big
  text('1973', cx, 520, {size:230,weight:900,color:C.red,align:'center',baseline:'middle',ls:-4,alpha:app(lt,0.2,0.6)*easeOutBack(clamp(lt/0.8))});
  text('It began as a small workshop.', cx, 700,
     {size:44,weight:800,color:C.ink,align:'center',alpha:app(lt,0.7,0.6)});
  text('A handful of people and a belief in Turkish engineering —', cx, 775,
     {size:28,weight:500,color:C.sub,align:'center',alpha:app(lt,1.0,0.6)});
  text('building gearboxes that simply would not stop.', cx, 815,
     {size:28,weight:500,color:C.sub,align:'center',alpha:app(lt,1.15,0.6)});
  ctx.restore();
});

// ---- S3: YEARS COUNT ----
scene(3.8,(lt,dur)=>{
  const {a,rise}=enter(lt,dur);
  ctx.save();ctx.globalAlpha=a;ctx.translate(0,rise);
  const cx=W/2;
  kicker('Three generations, one family', cx, 360, app(lt,0.1,0.5));
  const n=count(lt,0.3,1.3,D.years);
  const s=`${n}`;
  const size=300;
  const wn=measure(s,size,900,-6);
  const plusW=measure('+',150,900,0);
  const startx=cx-(wn+plusW+10)/2;
  ctx.save();ctx.globalAlpha*=app(lt,0.3,0.4);
  text(s, startx, 620, {size,weight:900,color:C.ink,align:'left',baseline:'middle',ls:-6});
  text('+', startx+wn+10, 560, {size:150,weight:900,color:C.red,align:'left',baseline:'middle'});
  ctx.restore();
  text('YEARS OF ENGINEERING MOTION', cx, 790, {size:34,weight:800,color:C.red,align:'center',ls:4,alpha:app(lt,1.1,0.6)});
  text('Still family-owned. Still made in Türkiye.', cx, 850, {size:28,weight:500,color:C.sub,align:'center',alpha:app(lt,1.3,0.6)});
  ctx.restore();
});

// ---- S4: SCALE / STAT CARDS ----
scene(11.0,(lt,dur)=>{
  const {a,rise}=enter(lt,dur);
  ctx.save();ctx.globalAlpha=a;ctx.translate(0,rise);
  const cx=W/2;
  kicker('i.Mak today', cx, 250, app(lt,0.1,0.5));
  text('Built at scale.', cx, 340, {size:60,weight:900,color:C.ink,align:'center',ls:-1,alpha:app(lt,0.25,0.5)});

  const cards=[
    {v:D.plantSqm, suf:' m²', lead:'', lbl:'Production plant', sub:'Pendik · İstanbul'},
    {v:D.team,     suf:'+',   lead:'', lbl:'Engineers & team', sub:'and growing'},
    {v:D.configurations, suf:'+', lead:'', lbl:'Product configurations', sub:'one of the widest ranges'},
    {v:D.series,   suf:'',    lead:'', lbl:'Gearbox & motor series', sub:'IR · IRK · YP · IRS · S …'}
  ];
  const gx=120, gy=430, cw=(W-gx*2-40)/2, ch=235, gap=40;
  const pos=[[gx,gy],[gx+cw+gap,gy],[gx,gy+ch+gap],[gx+cw+gap,gy+ch+gap]];
  const stride=1.7, base=0.6;
  cards.forEach((c,i)=>{
    const st=base+i*stride;
    const ca=app(lt,st,0.5);
    const pop=easeOutBack(clamp((lt-st)/0.55));
    const [x0,y0]=pos[i];
    ctx.save();
    ctx.globalAlpha*=ca;
    const sc=lerp(0.9,1,clamp(pop));
    ctx.translate(x0+cw/2,y0+ch/2);ctx.scale(sc,sc);ctx.translate(-(x0+cw/2),-(y0+ch/2));
    // card
    ctx.save();ctx.shadowColor=C.shadow;ctx.shadowBlur=30;ctx.shadowOffsetY=12;
    ctx.fillStyle=C.card;rr(x0,y0,cw,ch,26);ctx.fill();ctx.restore();
    ctx.strokeStyle=C.cardBd;ctx.lineWidth=1.5;rr(x0,y0,cw,ch,26);ctx.stroke();
    // red accent tab
    ctx.fillStyle=C.red;rr(x0,y0,66,8,4);ctx.fill();
    // number (counts only once its own card is in)
    const n=count(lt,st+0.15,1.15,c.v);
    let numStr=fmt(n);
    if(c.v>=1000000) numStr=(n/1000000>=1? (n/1000000).toFixed(n>=c.v?0:1):'0')+'M';
    const numFull=(c.v>=1000000? (n>=c.v?'1M':fmt(n)) : fmt(n))+c.suf;
    // choose font size to fit
    let ns=84; while(measure(numFull,ns,900,-1)>cw-72 && ns>48) ns-=4;
    text(numFull, x0+36, y0+120, {size:ns,weight:900,color:C.ink,align:'left',baseline:'alphabetic',ls:-1});
    text(c.lbl, x0+36, y0+168, {size:28,weight:700,color:C.ink,align:'left'});
    text(c.sub, x0+36, y0+202, {size:22,weight:500,color:C.sub,align:'left'});
    ctx.restore();
  });
  ctx.restore();
});

// ---- S5: WORLD MAP ----
scene(13.5,(lt,dur)=>{
  const {a}=enter(lt,dur);
  ctx.save();ctx.globalAlpha=a;
  const cx=W/2;
  kicker('From Türkiye to the world', cx, 180, app(lt,0.1,0.5));
  text('Everywhere industry turns.', cx, 262, {size:54,weight:900,color:C.ink,align:'center',ls:-1,alpha:app(lt,0.25,0.5)});

  // map rect
  const ox=50, mw=980, oy=330, mh=mw/2*0.86; // slight vertical squeeze
  const proj=(lon,lat)=>[ox+(lon+180)/360*mw, oy+(90-lat)/180*(mw/2)];
  // clip to a soft region (crop poles a bit)
  ctx.save();
  rr(ox,oy+40,mw,mh+40,24);ctx.clip();
  const mapIn=app(lt,0.3,0.9);
  ctx.globalAlpha*=mapIn;
  // land
  ctx.fillStyle=C.land;ctx.strokeStyle=C.landBd;ctx.lineWidth=0.8;
  for(const ring of WORLD.land){
    ctx.beginPath();
    for(let i=0;i<ring.length;i++){const[px,py]=proj(ring[i][0],ring[i][1]);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
    ctx.closePath();ctx.fill();ctx.stroke();
  }
  // turkey highlighted
  ctx.fillStyle=C.red;
  for(const ring of WORLD.turkey){
    ctx.beginPath();
    for(let i=0;i<ring.length;i++){const[px,py]=proj(ring[i][0],ring[i][1]);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
    ctx.closePath();ctx.fill();
  }
  ctx.restore(); // unclip

  const [hx,hy]=proj(D.centers[0].lon, D.centers[0].lat);
  // arcs + dots to each center
  const arcBase=1.3, arcStride=1.05;
  D.centers.forEach((c,i)=>{
    if(c.home) return;
    const idx=i-1;
    const st=arcBase+idx*arcStride;
    const prog=easeInOut(clamp((lt-st)/0.85));
    if(prog<=0) return;
    const [ex,ey]=proj(c.lon,c.lat);
    const mx=(hx+ex)/2, my=(hy+ey)/2;
    const d=Math.hypot(ex-hx,ey-hy);
    const lift=Math.min(d*0.32,150);
    const cxp=mx, cyp=my-lift;
    // partial quadratic bezier via sampling to prog
    ctx.save();ctx.globalAlpha*=mapIn;
    ctx.strokeStyle=c.isNew?C.redHi:'rgba(146,0,0,0.75)';
    ctx.lineWidth=c.isNew?4:3;ctx.lineCap='round';
    if(c.isNew)ctx.setLineDash([2,8]);
    ctx.beginPath();
    const N=40;
    for(let s=0;s<=N*prog;s++){
      const u=s/N;
      const x=(1-u)*(1-u)*hx+2*(1-u)*u*cxp+u*u*ex;
      const y=(1-u)*(1-u)*hy+2*(1-u)*u*cyp+u*u*ey;
      s?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();ctx.setLineDash([]);
    // dot pops when arc arrives
    const dp=easeOutBack(clamp((lt-(st+0.8))/0.4));
    if(dp>0){
      const r=(c.isNew?9:7)*clamp(dp);
      // halo
      ctx.globalAlpha*=mapIn;
      ctx.fillStyle=c.isNew?'rgba(184,20,20,0.22)':'rgba(146,0,0,0.18)';
      ctx.beginPath();ctx.arc(ex,ey,r*2.4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=c.isNew?C.redHi:C.red;
      ctx.beginPath();ctx.arc(ex,ey,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,r*0.38,0,Math.PI*2);ctx.fill();
      // label (per-center placement to avoid the European cluster colliding)
      const la=clamp((lt-(st+0.9))/0.4);
      const LBL={USA:{dy:30,align:'center',dx:0}, Spain:{dy:30,align:'center',dx:-4},
                 Poland:{dy:-28,align:'center',dx:4}, India:{dy:30,align:'center',dx:0},
                 'South Africa':{dy:34,align:'center',dx:0}, Egypt:{dy:16,align:'left',dx:16}};
      const L=LBL[c.name]||{dy:30,align:'center',dx:0};
      const subC=c.isNew?C.redHi:C.sub;
      let nameY, subY;
      if(L.dy<0){ subY=ey+L.dy; nameY=ey+L.dy-24; } else { nameY=ey+L.dy; subY=ey+L.dy+24; }
      text(c.name, ex+L.dx, nameY, {size:23,weight:800,color:C.ink,align:L.align,alpha:la,halo:4});
      text(c.sub,  ex+L.dx, subY,  {size:16,weight:600,color:subC,align:L.align,alpha:la,halo:3.5});
    }
    ctx.restore();
  });
  // İstanbul origin marker (pulsing)
  const pulse=0.5+0.5*Math.sin(lt*3.0);
  ctx.save();ctx.globalAlpha*=mapIn*app(lt,0.6,0.5);
  ctx.fillStyle='rgba(146,0,0,0.25)';ctx.beginPath();ctx.arc(hx,hy,10+pulse*10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=C.red;ctx.beginPath();ctx.arc(hx,hy,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hx,hy,3.2,0,Math.PI*2);ctx.fill();
  text('İSTANBUL', hx, hy-24, {size:19,weight:800,color:C.red,align:'center',ls:1,halo:4});
  ctx.restore();

  // bottom stat band
  const by=905;
  const statA=app(lt, arcBase+6*arcStride-0.5, 0.7);
  const cN=count(lt, arcBase+6*arcStride-0.4, 1.0, D.countries);
  ctx.save();ctx.globalAlpha*=statA;
  text(`${cN}+`, cx-250, by, {size:92,weight:900,color:C.red,align:'center',baseline:'middle',ls:-2});
  text('countries', cx-250, by+62, {size:24,weight:600,color:C.sub,align:'center'});
  // divider
  ctx.strokeStyle=C.cardBd;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-70,by-40);ctx.lineTo(cx-70,by+55);ctx.stroke();
  text(`${D.dealers} dealers`, cx+180, by-18, {size:38,weight:800,color:C.ink,align:'center'});
  text(`${D.salesOffices}+ international sales offices`, cx+180, by+28, {size:27,weight:600,color:C.sub,align:'center'});
  ctx.restore();
  ctx.restore();
});

// ---- S6: SECTORS ----
scene(7.2,(lt,dur)=>{
  const {a,rise}=enter(lt,dur);
  ctx.save();ctx.globalAlpha=a;ctx.translate(0,rise);
  const cx=W/2;
  kicker('Where i.Mak drives', cx, 230, app(lt,0.1,0.5));
  text('The industries the', cx, 330, {size:58,weight:900,color:C.ink,align:'center',ls:-1,alpha:app(lt,0.25,0.5)});
  text('world runs on.', cx, 400, {size:58,weight:900,color:C.red,align:'center',ls:-1,alpha:app(lt,0.4,0.5)});

  const sect=D.sectors;
  const cols=2, gx=150, gy=500, cw=(W-gx*2-40)/cols, ch=95, gap=40;
  const stride=0.5, base=0.7;
  sect.forEach((s,i)=>{
    const r=Math.floor(i/cols), col=i%cols;
    const x0=gx+col*(cw+gap), y0=gy+r*(ch+gap);
    const st=base+i*stride;
    const ca=app(lt,st,0.45);
    const pop=easeOutBack(clamp((lt-st)/0.5));
    ctx.save();ctx.globalAlpha*=ca;
    const sc=lerp(0.92,1,clamp(pop));
    ctx.translate(x0+cw/2,y0+ch/2);ctx.scale(sc,sc);ctx.translate(-(x0+cw/2),-(y0+ch/2));
    ctx.save();ctx.shadowColor=C.shadow;ctx.shadowBlur=20;ctx.shadowOffsetY=8;
    ctx.fillStyle=C.card;rr(x0,y0,cw,ch,20);ctx.fill();ctx.restore();
    ctx.strokeStyle=C.cardBd;ctx.lineWidth=1.4;rr(x0,y0,cw,ch,20);ctx.stroke();
    // little gear chip
    gear(x0+56,y0+ch/2,26,10, lt*0.8+i, C.red, .5, 1);
    text(s, x0+102, y0+ch/2, {size:34,weight:800,color:C.ink,align:'left',baseline:'middle'});
    ctx.restore();
  });
  ctx.restore();
});

// ---- S7: 2026 MOMENTUM ----
scene(4.6,(lt,dur)=>{
  const {a,rise}=enter(lt,dur);
  ctx.save();ctx.globalAlpha=a;ctx.translate(0,rise);
  const cx=W/2;
  kicker('2026 · still expanding', cx, 320, app(lt,0.1,0.5));
  text('The story isn’t finished.', cx, 450, {size:66,weight:900,color:C.ink,align:'center',ls:-1,alpha:app(lt,0.3,0.5)});
  // arrow draws to Egypt
  const aw=app(lt,0.7,0.6);
  text('New facility', cx, 560, {size:30,weight:600,color:C.sub,align:'center',alpha:aw});
  text('i·MAK EGYPT', cx, 640, {size:72,weight:900,color:C.red,align:'center',ls:1,alpha:app(lt,0.9,0.5)*easeOutBack(clamp((lt-0.9)/0.6))});
  // underline sweep
  const uw=clamp((lt-1.1)/0.5)*360;
  ctx.save();ctx.globalAlpha*=app(lt,1.1,0.4);ctx.strokeStyle=C.red;ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-uw/2,680);ctx.lineTo(cx+uw/2,680);ctx.stroke();ctx.restore();
  text('Growing across Africa, Europe, the Americas & Asia.', cx, 770,
     {size:28,weight:500,color:C.sub,align:'center',alpha:app(lt,1.5,0.6)});
  ctx.restore();
});

// ---- S8: END CARD ----
scene(5.0,(lt,dur)=>{
  const a=Math.min(clamp(lt/0.6), clamp((dur-lt)/0.5));
  ctx.save();ctx.globalAlpha=a;
  const cx=W/2;
  // logo big center
  const lh=120*easeOutBack(clamp(lt/0.8)), lw=logo.width*(120/logo.height);
  ctx.save();ctx.globalAlpha*=app(lt,0,0.6);
  ctx.drawImage(logo, cx-lw/2, 360-lh/2, lw, lh);ctx.restore();
  // rule
  const uw=clamp((lt-0.5)/0.5)*220;
  ctx.strokeStyle=C.red;ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-uw/2,470);ctx.lineTo(cx+uw/2,470);ctx.stroke();
  text('Engineered in Türkiye.', cx, 580, {size:52,weight:900,color:C.ink,align:'center',ls:-1,alpha:app(lt,0.6,0.5)});
  text('Trusted worldwide.', cx, 650, {size:52,weight:900,color:C.red,align:'center',ls:-1,alpha:app(lt,0.8,0.5)});
  text('Gearboxes · geared motors · drive systems — since 1973', cx, 740,
     {size:26,weight:500,color:C.sub,align:'center',alpha:app(lt,1.1,0.6)});
  // web pill
  const pa=app(lt,1.3,0.5);
  ctx.save();ctx.globalAlpha*=pa;
  const label=D.web, ps=30, pw=measure(label,ps,700,1)+80;
  ctx.fillStyle=C.red;rr(cx-pw/2,800,pw,64,32);ctx.fill();
  text(label, cx, 832, {size:ps,weight:700,color:'#fff',align:'center',baseline:'middle',ls:1});
  ctx.restore();
  ctx.restore();
});

// ---------- timeline ----------
let TOTAL=0; const STARTS=[];
SC.forEach(s=>{STARTS.push(TOTAL);TOTAL+=s.dur;});
window.__meta={fps:FPS,total:TOTAL};

function seek(t){
  t=clamp(t,0,TOTAL-0.0001);
  background();
  // find scene
  let i=SC.length-1;
  for(let k=0;k<SC.length;k++){if(t>=STARTS[k])i=k;}
  const lt=t-STARTS[i];
  SC[i].draw(lt,SC[i].dur);
  chrome(t, i===SC.length-1);
}
window.__seek=seek;
window.__total=()=>TOTAL;

// live preview when opened in a browser (not used for render)
if(!window.__headless){
  window.__ready.then(()=>{
    const t0=performance.now();
    (function loop(){const t=((performance.now()-t0)/1000)%TOTAL;seek(t);requestAnimationFrame(loop);})();
  });
}
</script>
