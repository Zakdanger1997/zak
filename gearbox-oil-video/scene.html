      A.p1.material.emissiveIntensity = heat * 1.4;
      const mp = local(A, A.meshPoint);
      const sk = seg(u, tMetal - 0.3, tMetal + 0.2);
      sparks.forEach((s, j) => {
        const ph = (t * 2.2 + hash(j)) % 1; s.visible = sk > 0;
        const dir = V(hash(j + 1) - 0.5, hash(j + 2) * 0.8 + 0.1, hash(j + 3) - 0.2).normalize();
        s.position.copy(mp).addScaledVector(dir, ph * 0.55); s.position.y -= ph * ph * 0.25;
        const L = 0.05 * (1 - ph) * sk; s.scale.set(0.012, L + 0.001, 0.012); s.lookAt(mp);
      });
      const tg = local(A, V(-0.02, 0.02, 0.1));
      cam(V(tg.x + lerp(2.2, 1.9, k), tg.y + lerp(1.3, 1.1, k), tg.z + lerp(4.4, 3.9, k)), tg, 32);
      draw2D.push(() => {
        badge('TOO LITTLE OIL', W / 2, 260, seg(u, 0.1, 0.6), { bg: '#ff3b2f', fg: '#fff', size: 70 });
        tag('RUNNING DRY', mp, seg(u, tDry - 0.2, tDry + 0.4), -160, -330);
        meter('WEAR', 280, 1560, heat * 0.95, seg(u, tWear - 0.6, tWear), '#ff3b2f');
      });
      break;
    }
    case 7: { // too much oil: churning, heat, oil life halves
      spin(A, t, 1.6);
      ghost(A, 0.2); A.internals.visible = true;
      const k = u / d;
      setOil(A, CTR.y + 0.55);
      const tChurn = wordAt(7, /churn/), tHeat = wordAt(7, /heat/), tTen = wordAt(7, /ten/), tHalf = wordAt(7, /half/);
      const ch = seg(u, tChurn - 0.4, tChurn + 0.4);
      bubbles.forEach((b, j) => {
        const g = j % 2 ? A.g2 : A.g1, c = local(A, V(g.position.x, g.position.y, g.position.z));
        const ang = t * (2 + hash(j) * 2) + hash(j + 7) * 6.28, rad = (0.4 + hash(j + 3) * 0.35) * K * 0.12;
        b.visible = ch > 0; const r = (0.012 + hash(j + 5) * 0.025) * ch;
        b.scale.setScalar(r); b.position.set(c.x + Math.cos(ang) * rad * 1.3, c.y + Math.sin(ang) * rad * 1.3, c.z + (hash(j + 9) - 0.5) * 0.25);
        if (b.position.y > CTR.y + 0.53) b.visible = false;
      });
      const temp = lerp(70, 92, seg(u, tHeat - 0.5, tTen + 0.6));
      const tg = V(0, CTR.y + 0.1, 0.3);
      cam(V(lerp(3.6, 3.2, k), lerp(2.5, 2.3, k), lerp(5.4, 4.9, k)), tg, 34);
      draw2D.push(() => {
        badge('TOO MUCH OIL', W / 2, 260, seg(u, 0.1, 0.6), { bg: '#ff3b2f', fg: '#fff', size: 70 });
        tag('CHURNING', local(A, V(A.O.x + 0.1, A.O.y + 0.06, 0.25)), seg(u, tChurn - 0.2, tChurn + 0.4), 170, -300);
        thermometer(940, 420, temp, seg(u, tHeat - 0.6, tHeat - 0.1));
        const lk = seg(u, tTen, tTen + 0.5), hk = seg(u, tHalf - 0.2, tHalf + 0.3);
        if (lk > 0) {
          ctx.save(); ctx.globalAlpha = lk; ctx.textAlign = 'center'; ctx.font = '58px Anton'; ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 14;
          ctx.fillText('OIL LIFE (RULE OF THUMB)', W / 2, 1500);
          ctx.font = '96px Anton'; ctx.fillText('80°C: ~10,000 h', W / 2, 1610);
          ctx.globalAlpha = hk; ctx.fillStyle = '#ff5a4a'; ctx.fillText('90°C: ~5,000 h', W / 2, 1720);
          ctx.restore();
        }
      });
      break;
    }
    case 8: { // recap
      spin(A, t, 0.6);
      const k = u / d;
      ghost(A, lerp(1, 0.35, seg(u, wordAt(8, /fill/) - 0.3, wordAt(8, /fill/) + 0.3)));
      A.internals.visible = A.bodyMat.opacity < 0.99;
      setOil(A, CTR.y - 0.05, A.internals.visible);
      const ang = lerp(0.75, 0.25, k);
      cam(V(Math.sin(ang) * 5.4, 2.4, Math.cos(ang) * 5.4), V(0, CTR.y + 0.3, 0.3), 34);
      const t1 = wordAt(8, /stop/), t2 = wordAt(8, /breather/), t3 = wordAt(8, /fill/), tEnd = wordAt(8, /few/);
      draw2D.push(() => {
        check('STOP THE LEAK', 150, 230, seg(u, t1 - 0.2, t1 + 0.3));
        check('BREATHER ON TOP', 150, 345, seg(u, t2 - 0.2, t2 + 0.3));
        check('RIGHT LEVEL, RIGHT POSITION', 150, 460, seg(u, t3 - 0.2, t3 + 0.3));
        const e = seg(u, tEnd - 0.2, tEnd + 0.4);
        if (e > 0) badge('CHECK THE OIL. SAVE THE GEARBOX.', W / 2, 1580, e, { size: 54 });
      });
      break;
    }
  }
}

// ---------- seek ----------
window.__info = { total: TOTAL, fps: FPS, frames: Math.ceil(TOTAL * FPS), scenes: scenes.map(s => [s.start, s.dur]) };
window.__seek = (t) => {
  t = clamp(t, 0, TOTAL - 1e-4);
  let i = scenes.findIndex(s => t >= s.start && t < s.start + s.dur); if (i < 0) i = scenes.length - 1;
  const u = t - scenes[i].start, d = scenes[i].dur;
  draw2D.length = 0; hideFx(); resetUnit(A); resetUnit(B); B.root.visible = false;
  sceneFn(i, u, d, t);
  // keep caps in sync after any late transforms
  renderer.render(scene, camera);
  ctx.drawImage(gl, 0, 0, W, H);
  vignette();
  draw2D.forEach(f => f());
  captions(t);
  // fade from/to black at the very start and end
  const fade = Math.min(clamp(t / 0.35), clamp((TOTAL - t) / 0.5));
  if (fade < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - fade})`; ctx.fillRect(0, 0, W, H); }
  return true;
};
window.__frame = (q = 0.9) => out.toDataURL('image/jpeg', q);
window.__bench = (t) => { const a = performance.now(); window.__seek(t); gl.getContext('webgl2').finish(); const b = performance.now(); out.toDataURL('image/jpeg', .93); return [b - a, performance.now() - b, renderer.info.render.triangles, BODY_GEO.index.count/3]; };
window.__ready = true;
