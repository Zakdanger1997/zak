<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coupling Co. — Precision Couplings</title>
  <!-- Tailwind via CDN, just for testing. The real project uses compiled Tailwind. -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="relative min-h-screen overflow-hidden bg-[#f0f0ee]">

    <!-- Fullscreen background video.
         SWAP the src below for your own coupling video URL. -->
    <video
      class="absolute inset-0 w-full h-full object-cover"
      src="https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
      autoplay muted loop playsinline></video>

    <!-- Foreground content -->
    <div class="relative z-10 flex flex-col min-h-screen">

      <!-- Navbar -->
      <nav class="flex items-center justify-center pt-4 sm:pt-6 px-4 sm:px-8 gap-2 sm:gap-3">
        <div class="flex items-center justify-center rounded-full w-10 h-10 sm:w-11 sm:h-11 shrink-0" style="background-color:#EDEDED">
          <!-- SWAP the path `d` below for your own logo mark (keep width/height/viewBox). -->
          <svg width="18" height="18" viewBox="0 0 256 256" fill="none">
            <path fill="rgb(84, 84, 84)" d="M128 40a88 88 0 100 176 88 88 0 000-176zm0 32a56 56 0 110 112 56 56 0 010-112zm0 24a32 32 0 100 64 32 32 0 000-64z"/>
          </svg>
        </div>
        <div class="flex items-center gap-4 sm:gap-10 rounded-xl px-4 sm:px-8 py-2.5 sm:py-3" style="background-color:#EDEDED">
          <a href="#" class="text-[12px] sm:text-[14px] font-medium text-gray-700 hover:text-gray-900 transition-colors duration-200">About</a>
          <a href="#" class="text-[12px] sm:text-[14px] font-medium text-gray-700 hover:text-gray-900 transition-colors duration-200">Products</a>
          <a href="#" class="text-[12px] sm:text-[14px] font-medium text-gray-700 hover:text-gray-900 transition-colors duration-200">Applications</a>
          <a href="#" class="text-[12px] sm:text-[14px] font-medium text-gray-700 hover:text-gray-900 transition-colors duration-200">Contact</a>
        </div>
      </nav>

      <!-- Hero content (bottom-left) -->
      <div class="flex-1 flex items-end pb-10 sm:pb-16 lg:pb-20 px-6 sm:px-12 md:px-20 lg:px-28">
        <div class="max-w-xs">
          <a href="#" class="inline-flex items-center gap-1.5 text-[11.5px] font-medium text-blue-500 hover:text-blue-600 transition-colors mb-3 group">
            Trusted by industrial plants worldwide
            <span class="inline-block transition-transform duration-200 group-hover:translate-x-0.5">→</span>
          </a>

          <h1 class="text-[1.5rem] sm:text-[1.75rem] leading-[1.15] font-medium text-gray-900 tracking-tight mb-3">
            Reliable, precision couplings built to keep your machines running.
          </h1>

          <p class="text-[13px] text-gray-400 font-normal mb-3">
            Power transmission you can count on.
          </p>

          <a href="#" class="inline-flex items-center gap-2 text-[13px] font-medium text-blue-500 border border-blue-400 rounded-full px-5 py-2.5 hover:bg-blue-500 hover:text-white hover:border-blue-500 transition-all duration-200 group">
            Request a free quote
            <span class="transition-transform duration-200 group-hover:translate-x-0.5">→</span>
          </a>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
