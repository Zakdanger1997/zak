<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<!-- i.Mak S 130 + S 63 worm-worm combination: why the small unit (S 63) always needs an output shaft and an output flange.
     Real meshes from the official i.Mak STEP models (models/, tools/prep_models.py). Shaft, flanges and bolts are drawn here.
     Deterministic: window.setup() -> duration, window.renderAt(t). Recorded by tools/record.js. 1920x1080. -->
<style>
@font-face { font-family: M; font-weight: 500; src: url(assets/montserrat-latin-500-normal.woff2); unicode-range: U+0000-00FF; }
@font-face { font-family: M; font-weight: 500; src: url(assets/montserrat-latin-ext-500-normal.woff2); unicode-range: U+0100-024F; }
@font-face { font-family: M; font-weight: 700; src: url(assets/montserrat-latin-700-normal.woff2); unicode-range: U+0000-00FF; }
@font-face { font-family: M; font-weight: 700; src: url(assets/montserrat-latin-ext-700-normal.woff2); unicode-range: U+0100-024F; }
@font-face { font-family: M; font-weight: 800; src: url(assets/montserrat-latin-800-normal.woff2); unicode-range: U+0000-00FF; }
@font-face { font-family: M; font-weight: 800; src: url(assets/montserrat-latin-ext-800-normal.woff2); unicode-range: U+0100-024F; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #111; font-family: M, sans-serif; }
#bg { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 75% at 50% 45%, #3a3f47 0%, #24272d 45%, #131518 100%); }
#grid { position: absolute; inset: 0; opacity: .07;
        background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px); background-size: 60px 60px; }
canvas { position: absolute; inset: 0; }
#shade { position: absolute; left: 0; right: 0; bottom: 0; height: 420px; background: linear-gradient(rgba(12,13,15,0), rgba(12,13,15,.78) 55%, rgba(12,13,15,.9)); }
#logo { position: absolute; left: 70px; top: 56px; width: 190px; }
#tag { position: absolute; right: 70px; top: 64px; color: rgba(255,255,255,.55); font-weight: 500; font-size: 22px; letter-spacing: 4px; }
.cap { position: absolute; left: 70px; bottom: 80px; max-width: 1180px; }
.cap .k { display: inline-block; background: #d1121b; color: #fff; font-weight: 800; font-size: 24px; letter-spacing: 3px; padding: 8px 16px; border-radius: 4px; }
.cap .t { color: #fff; font-weight: 700; font-size: 50px; line-height: 1.15; margin-top: 18px; text-shadow: 0 2px 18px rgba(0,0,0,.5); }
.cap .s { color: rgba(255,255,255,.75); font-weight: 500; font-size: 30px; line-height: 1.35; margin-top: 12px; }
.lbl { position: absolute; transform: translate(-50%, -100%); color: #fff; font-weight: 700; font-size: 26px; white-space: nowrap;
       background: rgba(20,22,26,.82); border: 2px solid #ffb21c; border-radius: 8px; padding: 8px 16px; }
.lbl:after { content: ''; position: absolute; left: 50%; bottom: -46px; width: 2px; height: 44px; background: #ffb21c; }
#x { position: absolute; width: 240px; height: 240px; }
#final { position: absolute; left: 0; right: 0; top: 110px; text-align: center; color: #fff; }
#final .a { font-weight: 800; font-size: 74px; }
#final .a b { color: #3ddc84; }
#final .b { margin: 26px auto 0; max-width: 1300px; font-weight: 500; font-size: 36px; line-height: 1.4; color: rgba(255,255,255,.88); }
#final .b em { font-style: normal; color: #ffb21c; font-weight: 700; }
</style></head>
<body>
<div id="bg"></div><div id="grid"></div>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="shade"></div><div id="ov"></div>
<img id="logo" src="assets/imak-logo-white.png">
<div id="tag">S 130 + S 63</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from './vendor/environments/RoomEnvironment.js';
import { toCreasedNormals, mergeVertices } from './vendor/utils/BufferGeometryUtils.js';

const R = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(1920, 1080, false);
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05; R.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(-400, 900, 700); scene.add(key);
const rim = new THREE.DirectionalLight(0xffe6d0, 0.9); rim.position.set(800, 300, -700); scene.add(rim);
const cam = new THREE.PerspectiveCamera(30, 1920 / 1080, 5, 20000);

const M = {
  paint: new THREE.MeshStandardMaterial({ color: 0xb8141b, roughness: .42, metalness: .05 }),
  steel: new THREE.MeshStandardMaterial({ color: 0xd8dbe0, roughness: .22, metalness: 1 }),
  bore: new THREE.MeshStandardMaterial({ color: 0x8a8f96, roughness: .35, metalness: .9 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x0b0b0c, roughness: .9, metalness: 0, side: THREE.DoubleSide }),
};
const newPart = () => new THREE.MeshStandardMaterial({ color: 0xdfe3e8, roughness: .2, metalness: 1, emissive: 0xffa000, emissiveIntensity: 0 });
const M_shaft = newPart(), M_flange = newPart(), M_b1 = newPart(), M_b2 = newPart();
const M_s130fl = new THREE.MeshStandardMaterial({ color: 0xa31117, roughness: .45, metalness: .05 });

async function stl(url) {
  const b = await (await fetch(url)).arrayBuffer(), dv = new DataView(b), n = dv.getUint32(80, true);
  const pos = new Float32Array(n * 9);
  for (let i = 0; i < n; i++) for (let j = 0; j < 9; j++) pos[i * 9 + j] = dv.getFloat32(84 + i * 50 + 12 + j * 4, true);
  let g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g = toCreasedNormals(g, Math.PI / 6);
  return g;
}
async function unit(name) {
  const grp = new THREE.Group();
  for (const p of ['paint', 'steel', 'bore']) grp.add(new THREE.Mesh(await stl(`models/${name}_${p}.stl`), M[p]));
  return grp;
}

// ---- geometry helpers (all axes along X) ----
const alongX = (g) => g.rotateZ(-Math.PI / 2);
function ring(r0, r1, x0, x1, holes = [], mat) { // disc with a centre hole and bolt holes, from x0 to x1
  const s = new THREE.Shape(); s.absarc(0, 0, r1, 0, Math.PI * 2);
  const h = new THREE.Path(); h.absarc(0, 0, r0, 0, Math.PI * 2, true); s.holes.push(h);
  for (const [r, a, d] of holes) { const p = new THREE.Path(); p.absarc(r * Math.cos(a), r * Math.sin(a), d / 2, 0, Math.PI * 2, true); s.holes.push(p); }
  const g = new THREE.ExtrudeGeometry(s, { depth: x1 - x0, bevelEnabled: true, bevelThickness: 1.2, bevelSize: 1.2, bevelSegments: 2, curveSegments: 64 });
  g.rotateY(Math.PI / 2); g.translate(x0, 0, 0);
  return new THREE.Mesh(g, mat);
}
function bolt(mat, len) { // head at x=0 pointing +x, shank toward -x
  const grp = new THREE.Group();
  const head = new THREE.Mesh(alongX(new THREE.CylinderGeometry(9.5, 9.5, 8, 6)), mat); head.position.x = 4; grp.add(head);
  const sh = new THREE.Mesh(alongX(new THREE.CylinderGeometry(5.6, 5.6, len, 20)), mat); sh.position.x = -len / 2; grp.add(sh);
  const w = new THREE.Mesh(alongX(new THREE.CylinderGeometry(11, 11, 1.6, 28)), mat); w.position.x = .8; grp.add(w);
  return grp;
}

// ---- layout (millimetres, STEP coordinates, Y up). S 130 input axis: y = 130, z = 0, input face at x = 158. ----
const AX = new THREE.Vector3(0, 130, 0);
const PCD = 84, D45 = [1, 3, 5, 7].map((k) => k * Math.PI / 4);
let s130, s63g, s63, shaft, flange, b1 = [], b2 = [], glow, s130fl;

window.setup = async () => {
  s130 = await unit('s130'); scene.add(s130);
  // S 130 input flange (motor-flange input, PCD 215, 4 holes at 45°) with the hollow worm bore behind it
  s130fl = ring(61, 98, 152, 170, D45.map((a) => [PCD, a, 12]), M_s130fl); s130fl.position.copy(AX); scene.add(s130fl);
  const wb = new THREE.Mesh(alongX(new THREE.CylinderGeometry(13, 13, 60, 32, 1, true)), M.dark); wb.position.set(130, 130, 0); scene.add(wb);
  const wbEnd = new THREE.Mesh(alongX(new THREE.CircleGeometry(13, 32)), M.dark); wbEnd.position.set(101, 130, 0); scene.add(wbEnd);

  s63g = new THREE.Group(); scene.add(s63g);
  s63 = await unit('s63'); s63g.add(s63);
  // hollow-output glow ring on the S 63 face that will meet the S 130
  glow = new THREE.Mesh(new THREE.TorusGeometry(15, 2.4, 16, 64).rotateY(Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffb21c, transparent: true, opacity: 0 }));
  glow.position.x = -57.5; s63g.add(glow);

  // 1) output shaft Ø25 with key, collar at the free end
  shaft = new THREE.Group();
  const sg = new THREE.Mesh(alongX(new THREE.CylinderGeometry(12.4, 12.4, 186, 48)), M_shaft); sg.position.x = -36; shaft.add(sg);
  const col = new THREE.Mesh(alongX(new THREE.CylinderGeometry(19, 19, 8, 48)), M_shaft); col.position.x = 61; shaft.add(col);
  const keyb = new THREE.Mesh(new THREE.BoxGeometry(60, 6, 8), M_shaft); keyb.position.set(-95, 12.4, 0); shaft.add(keyb);
  s63g.add(shaft);
  // 2) output flange (spigot toward the S 130), 4 bolts into the S 63, 4 holes on PCD 215 for the S 130
  flange = new THREE.Group();
  flange.add(ring(14, 98, -70, -58, D45.map((a) => [PCD, a, 12]), M_flange));
  flange.add(ring(14, 60, -76, -70, [], M_flange));
  s63g.add(flange);
  for (const a of D45) { const b = bolt(M_b1, 24); b.userData.a = a; s63g.add(b); b1.push(b); } // from the spigot side into the S 63
  for (const a of D45) { const b = bolt(M_b2, 40); b.userData.a = a; scene.add(b); b2.push(b); }
  await new Promise((r) => requestAnimationFrame(r));
  return REAL_END;
};

// ---- timeline ----
const T_END = 40;
const E = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const io = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const FAR = V(600, 130, 0), NEAR = V(345, 130, 0), FINAL = V(240, 130, 0);
// camera keys: [time, target, position]
const CAM = [
  [0, V(170, 40, 0), V(-260, 520, 1500)],
  [4.6, V(190, 60, 0), V(-120, 470, 1350)],
  [6.2, V(560, 120, 0), V(300, 300, 520)],
  [8.4, V(560, 120, 0), V(330, 260, 470)],
  [9.4, V(330, 90, 0), V(80, 420, 1100)],
  [12.2, V(560, 120, 0), V(760, 330, 620)],
  [17.6, V(570, 120, 0), V(790, 300, 560)],
  [19.2, V(520, 120, 0), V(300, 330, 560)],
  [23.6, V(510, 120, 0), V(320, 300, 520)],
  [25.6, V(260, 70, 0), V(-180, 520, 1250)],
  [30.4, V(240, 90, 0), V(-60, 420, 950)],
  [31.5, V(150, 30, 0), V(-300, 560, 1450)],
  [40, V(150, 30, 0), V(900, 520, 1250)],
];
function camAt(t) {
  let i = 0; while (i < CAM.length - 2 && t > CAM[i + 1][0]) i++;
  const [ta, A, PA] = CAM[i], [tb, B, PB] = CAM[i + 1], k = io(E(t, ta, tb));
  if (i === CAM.length - 2) { // final slow orbit around the assembled pair
    const ang = lerp(-0.42, 0.75, E(t, ta, tb)), r = 1350, k0 = io(E(t, ta, ta + 1.5));
    const P = V(A.x + Math.sin(ang) * r, 600, Math.cos(ang) * r), Tg = V(A.x, lerp(A.y, 190, k0), 0);
    cam.position.lerpVectors(PA, P, k0); cam.position.lerp(P, k0); cam.lookAt(Tg); return;
  }
  cam.position.lerpVectors(PA, PB, k); cam.lookAt(new THREE.Vector3().lerpVectors(A, B, k));
}

const CAPS = [
  [0, 5, 'S 130 + S 63', 'Sonsuz vidalı redüktör kombinasyonu', 'Büyük redüktör: S 130 · Küçük redüktör: S 63'],
  [5, 12, 'STANDART S 63', 'Standart S 63: delik (içi boş) çıkış mili, çıkış flanşı yok', 'Bu haliyle S 130’un girişine bağlanamaz.'],
  [12, 18, 'ADIM 1', 'S 63’e çıkış mili takılır', 'Mil, S 63’ün delik çıkışından geçer ve S 130’a doğru uzar.'],
  [18, 24, 'ADIM 2', 'S 63’e çıkış flanşı bağlanır', 'Flanş, S 63’ü S 130’un giriş flanşına bağlar.'],
  [24, 31, 'MONTAJ', 'Mil S 130’un girişine girer, flanş cıvatalanır', 'Küçük redüktör artık büyük redüktörü tahrik eder.'],
];
const LBLS = [ // [t0, t1, text, world point]
  [6.0, 9.0, 'Delik çıkış mili', () => s63g.localToWorld(V(-58, 22, 0))],
  [15.6, 17.8, 'Çıkış mili', () => shaft.localToWorld(V(-100, 18, 0))],
  [21.0, 23.6, 'Çıkış flanşı', () => flange.localToWorld(V(-64, 100, 0))],
];
function proj(p) { const v = p.clone().project(cam); return [(v.x + 1) * 960, (1 - v.y) * 540]; }

// story time (scene layout above) is stretched per scene so each Turkish narration line fits (tools/voiceover.py)
const SCN = [[0, 5, 8.5], [5, 12, 10.5], [12, 18, 6], [18, 24, 6], [24, 31, 7.5], [31, 40, 11]]; // [story a, story b, real seconds]
const REAL_END = SCN.reduce((s, x) => s + x[2], 0);
function story(T) { let r = 0; for (const [a, b, d] of SCN) { if (T < r + d) return a + (b - a) * (T - r) / d; r += d; } return 40; }
window.renderAt = async (T) => { const t = story(T);
  // S 63 group position
  let gp;
  if (t < 8.6) gp = FAR.clone();
  else if (t < 9.6) gp = new THREE.Vector3().lerpVectors(FAR, NEAR, io(E(t, 8.6, 9.6)));
  else if (t < 11.2) { gp = NEAR.clone(); gp.x += Math.sin((t - 9.6) * 40) * 4 * (1 - E(t, 9.6, 10.6)); }
  else if (t < 25) gp = new THREE.Vector3().lerpVectors(NEAR, FAR, io(E(t, 11.2, 12.2)));
  else gp = new THREE.Vector3().lerpVectors(FAR, FINAL, io(E(t, 25, 28.2)));
  s63g.position.copy(gp);
  s63g.position.y += t < 25 ? Math.sin(t * 1.3) * 3 : Math.sin(t * 1.3) * 3 * (1 - E(t, 25, 27));

  glow.material.opacity = (E(t, 5.6, 6.2) - E(t, 9.6, 10.2)) * (.6 + .4 * Math.sin(t * 7));
  // 1) shaft slides in from the free side (+x)
  const ks = io(E(t, 13, 16.6)); shaft.visible = t >= 12.6; shaft.position.x = lerp(420, 0, ks);
  // 2) flange flies in from -x, then bolts screw in
  const kf = io(E(t, 19, 21.6)); flange.visible = t >= 18.6; flange.position.x = lerp(-320, 0, kf); flange.rotation.x = lerp(-1.2, 0, kf);
  b1.forEach((b, k) => {
    const kb = io(E(t, 21.6 + k * .25, 22.6 + k * .25)); b.visible = t >= 21.2;
    b.position.set(lerp(-160, -70, kb), 66 * Math.cos(b.userData.a), 66 * Math.sin(b.userData.a)); b.rotation.set((1 - kb) * 9, Math.PI, 0);
  });
  b2.forEach((b, k) => {
    const kb = io(E(t, 28.4 + k * .25, 29.6 + k * .25)); b.visible = t >= 28;
    b.position.set(lerp(300, 182, kb), 130 + PCD * Math.cos(b.userData.a), PCD * Math.sin(b.userData.a)); b.rotation.x = (1 - kb) * 9;
  });
  const pulse = (a, b) => (E(t, a, a + .4) - E(t, b - .5, b)) * (.35 + .25 * Math.sin(t * 6));
  M_shaft.emissiveIntensity = pulse(13, 18); M_flange.emissiveIntensity = pulse(19, 24); M_b1.emissiveIntensity = pulse(21.6, 24);
  M_b2.emissiveIntensity = pulse(28.4, 31);

  camAt(t);
  R.render(scene, cam);

  // overlays
  let h = '';
  for (const [a, b, k, ti, s] of CAPS) {
    if (t < a || t >= b) continue;
    const o = Math.min(E(t, a + .1, a + .6), 1 - E(t, b - .5, b)), dy = (1 - o) * 30;
    h += `<div class="cap" style="opacity:${o};transform:translateY(${dy}px)"><div class="k">${k}</div><div class="t">${ti}</div><div class="s">${s}</div></div>`;
  }
  for (const [a, b, txt, f] of LBLS) {
    if (t < a || t >= b) continue;
    const [x, y] = proj(f()), o = Math.min(E(t, a, a + .4), 1 - E(t, b - .4, b));
    h += `<div class="lbl" style="left:${x}px;top:${y - 48}px;opacity:${o}">${txt}</div>`;
  }
  if (t > 9.7 && t < 11.4) {
    const [x, y] = proj(V(250, 130, 0)), o = Math.min(E(t, 9.7, 10), 1 - E(t, 11.1, 11.4)), s = .7 + .3 * io(E(t, 9.7, 10.1));
    h += `<svg id="x" viewBox="0 0 100 100" style="left:${x - 120}px;top:${y - 120}px;opacity:${o};transform:scale(${s})"><circle cx="50" cy="50" r="44" fill="rgba(209,18,27,.92)"/><path d="M32 32 L68 68 M68 32 L32 68" stroke="#fff" stroke-width="10" stroke-linecap="round"/></svg>`;
  }
  if (t >= 31) {
    const o1 = E(t, 31.4, 32.2), o2 = E(t, 33, 33.8);
    h += `<div id="final"><div class="a" style="opacity:${o1};transform:translateY(${(1 - o1) * 30}px)"><b>✓</b> Bu kombinasyon yapılabilir</div>
      <div class="b" style="opacity:${o2};transform:translateY(${(1 - o2) * 24}px)">Ancak küçük redüktörde (S 63) her zaman <em>çıkış mili</em> ve <em>çıkış flanşı</em> olmalıdır.</div></div>`;
  }
  document.getElementById('ov').innerHTML = h;
  document.getElementById('shade').style.opacity = 1 - E(t, 31, 31.6);
};
window.ready = true;
</script></body></html>
