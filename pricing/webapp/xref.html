<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İ-MAK · Equivalent Selector</title>
<style>
  :root{--bg:#080d13;--bg2:#0c141d;--panel:#0f1925;--line:#1e3244;--line2:#2a4a63;--txt:#dbe7f0;
    --mut:#7e97ac;--dim:#4d6274;--acc:#25d0d0;--acc2:#0e8f9c;--blue:#3b9dff;--good:#37d67a;--warn:#f2b544;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box}html,body{margin:0}
  body{font:14px/1.5 system-ui,Segoe UI,Roboto,Arial,sans-serif;color:var(--txt);min-height:100vh;
    background:radial-gradient(1200px 500px at 85% -10%,rgba(37,208,208,.08),transparent 60%),linear-gradient(180deg,#0a1119,#080d13 40%)}
  .grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4;
    background-image:linear-gradient(rgba(37,208,208,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(37,208,208,.045) 1px,transparent 1px);
    background-size:44px 44px;mask-image:linear-gradient(180deg,#000,transparent 70%)}
  header{position:relative;z-index:2;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(18,32,50,.9),rgba(8,13,19,.6))}
  .logo{display:flex;align-items:center;gap:11px}
  .logo .mark{width:34px;height:34px;border-radius:9px;background:conic-gradient(from 210deg,var(--acc),var(--blue),var(--acc));display:grid;place-items:center;font-weight:800;color:#04222a}
  .logo b{font-size:16px;letter-spacing:.5px}.logo small{display:block;color:var(--acc);font:600 10px/1 var(--mono);letter-spacing:2px;margin-top:2px}
  .nav{margin-left:auto;display:flex;gap:8px}
  .nav a{font:600 11px/1 var(--mono);color:var(--mut);text-decoration:none;background:rgba(18,32,50,.6);border:1px solid var(--line);padding:8px 12px;border-radius:20px}
  .nav a.on{color:#04222a;background:var(--acc);border-color:var(--acc)}
  .wrap{position:relative;z-index:2;max-width:1000px;margin:20px auto;padding:0 18px;display:grid;grid-template-columns:370px 1fr;gap:18px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .phead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(18,32,50,.4)}
  .phead h2{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);margin:0}
  .pbody{padding:16px}
  label{display:block;font:600 10px/1 var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:12px 0 6px}
  select,input{font:inherit;color:var(--txt);background:#0a121b;border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%}
  select:focus,input:focus{outline:none;border-color:var(--acc)}
  .row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
  .brandrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .brandbtn{font:700 13px var(--mono);color:var(--mut);background:#0a121b;border:1px solid var(--line);border-radius:8px;padding:12px 8px;cursor:pointer;text-align:center}
  .brandbtn.on{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#04222a;border-color:var(--acc)}
  .eqwrap{display:flex;align-items:stretch;gap:14px;flex-wrap:wrap}
  .card{flex:1;min-width:210px;border:1px solid var(--line);border-radius:12px;padding:16px;background:rgba(10,18,27,.5)}
  .card.comp{border-color:rgba(242,181,68,.4)}
  .card.imak{border-color:var(--acc2);background:linear-gradient(150deg,rgba(37,208,208,.12),rgba(59,157,255,.05))}
  .card .tag{font:600 10px/1 var(--mono);letter-spacing:1.5px;text-transform:uppercase}
  .card.comp .tag{color:var(--warn)}.card.imak .tag{color:var(--acc)}
  .card .model{font:800 26px/1.05 var(--mono);color:#fff;margin:8px 0 4px}
  .card .sub{color:var(--mut);font:12px var(--mono)}
  .arrow{display:flex;align-items:center;font-size:26px;color:var(--acc)}
  @media(max-width:820px){.arrow{transform:rotate(90deg);justify-content:center;width:100%}}
  .spec{margin-top:14px}
  .spec .r{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(30,50,68,.5);font-size:13px}
  .spec .r .k{color:var(--mut)}.spec .r .v{font:600 13px var(--mono)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{font:600 10px/1 var(--mono);letter-spacing:.5px;padding:6px 10px;border-radius:20px;border:1px solid var(--line);color:var(--mut);background:#0a121b}
  .chip.ex{color:var(--good);border-color:rgba(55,214,122,.35)}
  .chip.prov{color:var(--warn);border-color:rgba(242,181,68,.35)}
  .tqbig{font:800 20px var(--mono);color:var(--acc)}
  .muted{color:var(--dim);font:12px var(--mono);text-align:center;padding:30px 10px}
  .foot{max-width:1000px;margin:8px auto 30px;padding:0 18px;position:relative;z-index:2;font:11px/1.5 var(--mono);color:var(--dim)}
</style>
</head>
<body>
<div class="grid-bg"></div>
<header>
  <div class="logo"><div class="mark">İM</div><div><b>EQUIVALENT SELECTOR</b><small>COMPETITOR → İ-MAK SELECTION</small></div></div>
  <div class="nav"><a href="index.html">Pricing</a><a href="xref.html" class="on">Equivalent</a><a href="applications.html">Applications</a></div>
</header>

<div class="wrap">
  <div class="panel">
    <div class="phead"><h2>Competitor unit</h2></div>
    <div class="pbody">
      <label>Brand</label>
      <div class="brandrow" id="brands"></div>
      <label>Product type</label><select id="series"></select>
      <div id="variantWrap" style="display:none"><label>Variant</label>
        <select id="variant"><option value="L">L · inline</option><option value="K">K · right-angle</option></select></div>
      <label>Competitor model</label><select id="model"></select>
    </div>
  </div>

  <div class="panel">
    <div class="phead"><h2>İ-MAK equivalent</h2></div>
    <div class="pbody" id="out"><div class="muted">Select brand + model…</div></div>
  </div>
</div>
<div class="foot" id="foot"></div>

<script src="xref_data.js"></script>
<script>
const X=window.XREF,$=s=>document.querySelector(s);
const SERIES_NAME={IR:"Helical (inline)",IRK:"Helical bevel (right-angle)",YP:"Parallel shaft",PLAN:"Planetary"};
const BRANDS=["SEW","NORD","Bonfiglioli","Yilmaz"];
let brand="SEW";

function seriesForBrand(b){
  if(b==="Yilmaz") return ["PLAN"];
  return [...new Set(X.gearbox.filter(g=>g.brand===b).map(g=>g.series))];
}
function fmt(n){return n==null?"—":Math.round(n).toLocaleString("en-US");}

function initBrands(){
  $('#brands').innerHTML=BRANDS.map(b=>`<div class="brandbtn ${b===brand?'on':''}" data-b="${b}">${b}</div>`).join("");
  $('#brands').querySelectorAll('.brandbtn').forEach(el=>el.onclick=()=>{brand=el.dataset.b;
    $('#brands').querySelectorAll('.brandbtn').forEach(x=>x.classList.toggle('on',x.dataset.b===brand));
    fillSeries();});
}
function fillSeries(){
  const ss=seriesForBrand(brand);
  $('#series').innerHTML=ss.map(s=>`<option value="${s}">${SERIES_NAME[s]||s}</option>`).join("");
  $('#variantWrap').style.display=brand==="Yilmaz"?"block":"none";
  fillModels();
}
function fillModels(){
  if(brand==="Yilmaz"){
    const v=$('#variant').value;
    const ms=X.yilmaz.filter(y=>y.v===v).map(y=>y.m);
    $('#model').innerHTML=ms.map(m=>`<option>${m}</option>`).join("");
  }else{
    const s=$('#series').value;
    const ms=X.gearbox.filter(g=>g.brand===brand&&g.series===s&&g.comp).map(g=>g.comp);
    $('#model').innerHTML=[...new Set(ms)].map(m=>`<option>${m}</option>`).join("");
  }
  render();
}
$('#series').addEventListener('change',fillModels);
$('#variant').addEventListener('change',fillModels);
$('#model').addEventListener('change',render);

function render(){
  const model=$('#model').value;
  if(brand==="Yilmaz") return renderYilmaz(model);
  const s=$('#series').value;
  const g=X.gearbox.find(x=>x.brand===brand&&x.series===s&&x.comp===model);
  if(!g){$('#out').innerHTML='<div class="muted">no data</div>';return;}
  const exact=g.exact, imak=g.imak_sugg||g.imak;
  $('#out').innerHTML=`
    <div class="eqwrap">
      <div class="card comp"><div class="tag">◈ ${brand} · ${SERIES_NAME[s]}</div>
        <div class="model">${g.comp}</div>
        <div class="spec">
          <div class="r"><span class="k">Output shaft Ø</span><span class="v">${g.d||'—'}</span></div>
          <div class="r"><span class="k">Centre height h</span><span class="v">${g.h||'—'}</span></div>
          <div class="r"><span class="k">Max torque</span><span class="v">${fmt(g.tq)} Nm</span></div>
        </div></div>
      <div class="arrow">→</div>
      <div class="card imak"><div class="tag">✦ İ-MAK EQUIVALENT</div>
        <div class="model">${imak||'—'}</div>
        <div class="sub">${SERIES_NAME[s]}</div>
        <div class="spec"><div class="r"><span class="k">Max torque class</span><span class="tqbig">${fmt(g.tq)} Nm</span></div></div>
        <div class="chips"><span class="chip ex">from in-house sheet ✓</span>
          <span class="chip ${exact?'ex':'prov'}">${exact?'direct match ✓':'nearest size (by torque) ≈'}</span></div>
      </div>
    </div>`;
  $('#foot').innerHTML=`Source: I-MAK↔${brand} in-house comparison table (${SERIES_NAME[s]}). ${exact?'Direct size-for-size equivalence.':'Competitor size sits between İ-MAK sizes — nearest covering size shown.'} Confirm shaft Ø / height against the drawing before final selection.`;
}

function renderYilmaz(m){
  const v=$('#variant').value; const frame=m.slice(0,2),stageN=parseInt(m.slice(2)),stage='S'+stageN;
  const series=v==='K'?'IPRK':'IPR';
  const map=X.xmap.find(x=>x.frame===frame&&x['var']===v);
  const isz=map?map.isz:'?',conf=map?map.conf:'unmapped';
  $('#out').innerHTML=`
    <div class="eqwrap">
      <div class="card comp"><div class="tag">◈ Yilmaz · Planetary</div>
        <div class="model">${m}</div>
        <div class="spec">
          <div class="r"><span class="k">Frame</span><span class="v">${frame}</span></div>
          <div class="r"><span class="k">Stages</span><span class="v">${stageN}</span></div>
          <div class="r"><span class="k">Variant</span><span class="v">${v} · ${v==='K'?'right-angle':'inline'}</span></div>
        </div></div>
      <div class="arrow">→</div>
      <div class="card imak"><div class="tag">✦ İ-MAK EQUIVALENT</div>
        <div class="model">${series} ${isz}</div><div class="sub">${stageN}-stage · ${v==='K'?'right-angle':'inline'}</div>
        <div class="chips"><span class="chip ex">variant → ${series} ✓</span><span class="chip ex">stage → ${stage} ✓</span>
          <span class="chip ${conf==='confirmed'?'ex':'prov'}">size → ${isz} ${conf==='confirmed'?'✓':'≈'}</span></div>
      </div>
    </div>`;
  $('#foot').innerHTML=`Yilmaz planetary: variant→series &amp; stage exact; frame→size ${conf} (edit xref_map.csv with your validated sheet).`;
}

initBrands(); fillSeries();
</script>
</body>
</html>
