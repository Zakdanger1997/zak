<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İ-MAK · Cross-Reference</title>
<style>
  :root{--bg:#080d13;--bg2:#0c141d;--panel:#0f1925;--line:#1e3244;--line2:#2a4a63;--txt:#dbe7f0;
    --mut:#7e97ac;--dim:#4d6274;--acc:#25d0d0;--acc2:#0e8f9c;--blue:#3b9dff;--good:#37d67a;--warn:#f2b544;--bad:#ff6b6b;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box}html,body{margin:0}
  body{font:14px/1.5 system-ui,Segoe UI,Roboto,Arial,sans-serif;color:var(--txt);min-height:100vh;
    background:radial-gradient(1200px 500px at 85% -10%,rgba(37,208,208,.08),transparent 60%),linear-gradient(180deg,#0a1119,#080d13 40%)}
  .grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4;
    background-image:linear-gradient(rgba(37,208,208,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(37,208,208,.045) 1px,transparent 1px);
    background-size:44px 44px;mask-image:linear-gradient(180deg,#000,transparent 70%)}
  header{position:relative;z-index:2;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(18,32,50,.9),rgba(8,13,19,.6))}
  .logo{display:flex;align-items:center;gap:11px}
  .logo .mark{width:34px;height:34px;border-radius:9px;background:conic-gradient(from 210deg,var(--acc),var(--blue),var(--acc));display:grid;place-items:center;font-weight:800;color:#04222a}
  .logo b{font-size:16px;letter-spacing:.5px}.logo small{display:block;color:var(--acc);font:600 10px/1 var(--mono);letter-spacing:2px;margin-top:2px}
  .nav{margin-left:auto;display:flex;gap:8px}
  .nav a{font:600 11px/1 var(--mono);color:var(--mut);text-decoration:none;background:rgba(18,32,50,.6);border:1px solid var(--line);padding:8px 12px;border-radius:20px}
  .nav a.on{color:#04222a;background:var(--acc);border-color:var(--acc)}
  .wrap{position:relative;z-index:2;max-width:1080px;margin:20px auto;padding:0 18px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .phead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(18,32,50,.4)}
  .phead h2{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);margin:0}
  .phead .badge{margin-left:auto;font:600 10px/1 var(--mono);padding:4px 8px;border-radius:20px;background:rgba(242,181,68,.15);color:var(--warn);border:1px solid rgba(242,181,68,.3)}
  .pbody{padding:16px}
  label{display:block;font:600 10px/1 var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:12px 0 6px}
  select,input{font:inherit;color:var(--txt);background:#0a121b;border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%}
  select:focus,input:focus{outline:none;border-color:var(--acc)}
  .row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
  .banner{margin:0;padding:10px 16px;background:rgba(242,181,68,.1);border-bottom:1px solid rgba(242,181,68,.25);font:11px/1.4 var(--mono);color:var(--warn)}
  .kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(30,50,68,.5);font-size:13px}
  .kv .k{color:var(--mut)}.kv .v{font:600 13px var(--mono)}
  .big{font:800 26px/1.1 var(--mono);color:#fff;margin:6px 0}
  .arrow{text-align:center;color:var(--acc);font-size:24px;padding:6px}
  .card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;background:rgba(10,18,27,.5)}
  .card.imak{border-color:var(--acc2);background:linear-gradient(120deg,rgba(37,208,208,.1),rgba(59,157,255,.05))}
  .card h3{margin:0 0 6px;font:700 11px/1 var(--mono);letter-spacing:1px;text-transform:uppercase}
  .card.comp h3{color:var(--warn)}.card.imak h3{color:var(--acc)}
  .delta{font:700 13px var(--mono);padding:3px 8px;border-radius:6px}
  .delta.up{background:rgba(255,107,107,.15);color:var(--bad)}.delta.down{background:rgba(55,214,122,.15);color:var(--good)}
  .conf{font:600 10px/1 var(--mono);padding:3px 7px;border-radius:20px}
  .conf.provisional{background:rgba(242,181,68,.15);color:var(--warn)}.conf.confirmed{background:rgba(55,214,122,.15);color:var(--good)}
  .muted{color:var(--dim);font:12px var(--mono);text-align:center;padding:30px 10px}
  .foot{max-width:1080px;margin:6px auto 30px;padding:0 18px;position:relative;z-index:2;font:11px/1.5 var(--mono);color:var(--dim)}
  table{width:100%;border-collapse:collapse;margin-top:6px}td,th{padding:5px 6px;text-align:right;font:11px var(--mono)}
  th{color:var(--mut);border-bottom:1px solid var(--line)}td:first-child,th:first-child{text-align:left}
  td.hit{color:var(--acc);font-weight:700}
</style>
</head>
<body>
<div class="grid-bg"></div>
<header>
  <div class="logo"><div class="mark">İM</div><div><b>CROSS-REFERENCE</b><small>COMPETITOR → İ-MAK EQUIVALENT</small></div></div>
  <div class="nav"><a href="index.html">Pricing</a><a href="xref.html" class="on">Cross-Ref</a></div>
</header>

<div class="wrap">
  <div class="panel">
    <div class="phead"><h2>Competitor input</h2></div>
    <div class="pbody">
      <div class="row">
        <div><label>Brand</label><select id="brand"><option>Yilmaz</option><option disabled>SEW (pending sheet)</option><option disabled>NORD (pending sheet)</option><option disabled>Bonfiglioli (pending sheet)</option></select></div>
        <div><label>Product</label><select id="ptype"><option value="planetary">Planetary (PT/RT)</option></select></div>
      </div>
      <div class="row">
        <div><label>Variant</label><select id="variant"><option value="L">L · inline</option><option value="K">K · right-angle</option></select></div>
        <div><label>Model</label><select id="model"></select></div>
      </div>
      <label>FX rate — TL per EUR (to compare)</label>
      <input id="fx" type="number" value="35" step="0.5">
    </div>
  </div>

  <div class="panel">
    <div class="phead"><h2>Equivalent &amp; price</h2><span class="badge" id="confbadge">—</span></div>
    <div class="banner">⚠ Size mapping is PROVISIONAL (rank-aligned). Edit <b>pricing/data/xref_map.csv</b> with your in-house equivalence sheet to lock it. Variant→series &amp; stage map are exact.</div>
    <div class="pbody" id="out"><div class="muted">Select a competitor model…</div></div>
  </div>
</div>
<div class="foot" id="foot"></div>

<script src="xref_data.js"></script>
<script>
const X=window.XREF,$=s=>document.querySelector(s);
function fmt(n){return n==null?"—":n.toLocaleString("en-US",{maximumFractionDigits:0});}
function models(v){return X.yilmaz.filter(y=>y.v===v).map(y=>y.m);}
function fillModels(){const v=$('#variant').value;$('#model').innerHTML=models(v).map(m=>`<option>${m}</option>`).join("");render();}
$('#variant').addEventListener('change',fillModels);
['#model','#fx','#brand'].forEach(s=>$(s).addEventListener('change',render));
fillModels();

function imakPrice(series,size,stage){ // default FS config
  const rows=X.planetary.filter(p=>p.s===series&&p.sz===size&&p.st===stage);
  const fs=rows.find(p=>p.cfg==='FS')||rows.sort((a,b)=>a.p-b.p)[0];
  return fs?fs.p:null;
}
function render(){
  const v=$('#variant').value,m=$('#model').value,fx=parseFloat($('#fx').value)||35;
  const y=X.yilmaz.find(u=>u.v===v&&u.m===m); if(!y){$('#out').innerHTML='<div class="muted">no data</div>';return;}
  const frame=m.slice(0,2), stageN=parseInt(m.slice(2)), stage='S'+stageN;
  const series=v==='K'?'IPRK':'IPR';
  const map=X.xmap.find(x=>x.brand==='Yilmaz'&&x.frame===frame&&x['var']===v);
  const isz=map?map.isz:null, conf=map?map.conf:'unmapped';
  $('#confbadge').textContent=conf.toUpperCase();
  $('#confbadge').className='badge';
  const imk=isz?imakPrice(series,isz,stage):null;
  const compTL=y.pt, imkTL=imk!=null?imk*fx:null;
  let delta='';
  if(imkTL&&compTL){const d=(imkTL-compTL)/compTL*100;delta=`<span class="delta ${d<0?'down':'up'}">${d>0?'+':''}${d.toFixed(0)}% vs Yilmaz</span>`;}
  // price ladder across IMAK sizes for this series+stage
  const ladder=[...new Set(X.planetary.filter(p=>p.s===series&&p.st===stage&&p.cfg==='FS').map(p=>p.sz))]
    .sort((a,b)=>+a-+b).map(sz=>({sz,p:imakPrice(series,sz,stage)}));
  $('#out').innerHTML=`
    <div class="card comp"><h3>Yilmaz ${v==='K'?'RN..K/PT..K':'PN..L/PT..L'} ${m}</h3>
      <div class="kv"><span class="k">Frame · stages · variant</span><span class="v">${frame} · ${stageN} · ${v}</span></div>
      <div class="kv"><span class="k">PT (bare) price</span><span class="v">${fmt(y.pt)} ₺</span></div>
      <div class="kv"><span class="k">RT price</span><span class="v">${fmt(y.rt)} ₺</span></div>
    </div>
    <div class="arrow">↓ maps to <span class="conf ${conf}">${conf}</span></div>
    <div class="card imak"><h3>İ-MAK ${series} ${isz||'?'} · ${stage} ${delta}</h3>
      ${imk!=null?`
      <div class="kv"><span class="k">İ-MAK list (FS config)</span><span class="v">€ ${fmt(imk)}</span></div>
      <div class="kv"><span class="k">≈ in TL @ ${fx}</span><span class="v">${fmt(imkTL)} ₺</span></div>
      <div class="big">€ ${fmt(imk)}</div>`
      :`<div class="muted">No İ-MAK size mapped for frame ${frame} — add it to xref_map.csv</div>`}
    </div>
    <label>İ-MAK ${series} price ladder · ${stage} (pick the true equivalent for your sheet)</label>
    <table><tr><th>Size</th><th>€ list</th><th>≈ ₺ @${fx}</th></tr>
      ${ladder.map(x=>`<tr><td class="${x.sz===isz?'hit':''}">${series} ${x.sz}</td><td>${fmt(x.p)}</td><td>${fmt(x.p!=null?x.p*fx:null)}</td></tr>`).join("")}
    </table>`;
  $('#foot').innerHTML=`Yilmaz list 08.09.2025 (TL) · İ-MAK planetary 26.02.2026 (EUR) · stage & variant mapping exact; size mapping ${conf} — edit pricing/data/xref_map.csv · FX is indicative only`;
}
</script>
</body>
</html>
